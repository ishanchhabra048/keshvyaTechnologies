  <rect x="48" y="140" width="480" height="16" rx="4" fill="#6B6B80" opacity="0.5"/>
  <rect x="48" y="168" width="380" height="16" rx="4" fill="#6B6B80" opacity="0.3"/>
  <rect x="48" y="210" width="160" height="44" rx="10" fill="url(#p1-grad)"/>

