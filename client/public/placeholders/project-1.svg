  <circle cx="28" cy="24" r="6" fill="#F87171" opacity="0.8"/>
  <circle cx="48" cy="24" r="6" fill="#FBBF24" opacity="0.8"/>
  <circle cx="68" cy="24" r="6" fill="#34D399" opacity="0.8"/>
  <rect x="120" y="14" width="400" height="20" rx="6" fill="#181824"/>
  
  <!-- Content Area -->
